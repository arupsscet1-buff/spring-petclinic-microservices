apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: spring-petclinic-app
  labels:
    app: discovery-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      initContainers:
      - name: wait-for-config-server
        image: curlimages/curl:8.9.1
        command:
          - sh
          - -c
          - |
            echo "Waiting for config-server to be healthy..."
            until curl -sf -o /dev/null http://config-server:8888; do
            echo "config-server not ready yet, retrying in 5s..."
              sleep 5
            done
            echo "config-server is up."

      containers:
      - name: discovery-server
        image: arupsscet1/spring-petclinic-discovery-server:${IMAGE_TAG}
        ports:
        - containerPort: 8761
        resources:
          requests:
            memory: '256Mi'
          limits:
            memory: '512Mi'
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6

---

apiVersion: v1
kind: Service
metadata:
  name: discovery-server
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
