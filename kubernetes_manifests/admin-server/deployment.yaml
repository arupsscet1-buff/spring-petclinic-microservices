apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-server
  namespace: app
  labels:
    app: admin-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-server
  template:
    metadata:
      labels:
        app: admin-server
    spec:
      initContainers:
        - name: wait-for-config-server
          image: curlimages/curl:8.9.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for config-server..."
              until curl -sf -o /dev/null http://config-server:8888; do
                sleep 5
              done
              echo "config-server is up."
        - name: wait-for-discovery-server
          image: curlimages/curl:8.9.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for discovery-server..."
              until curl -sf -o /dev/null http://discovery-server:8761; do
                sleep 5
              done
              echo "discovery-server is up."
      containers:
      - name: admin-server
        image: arupsscet1/spring-petclinic-admin-server:${IMAGE_TAG}
        ports:
        - containerPort: 9090
        resources:
          requests:
            memory: '256Mi'
          limits:
            memory: '512Mi'
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6

---

apiVersion: v1
kind: Service
metadata:
  name: admin-server
spec:
  selector:
    app: admin-server
  ports:
    - port: 9090
      targetPort: 9090