apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: spring-petclinic-app
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
      - name: config-server
        image: arupsscet1/spring-petclinic-config-server:${IMAGE_TAG}
        ports:
        - containerPort: 8888
        resources:
          requests:
            memory: '256Mi'
          limits:
            memory: '512Mi'
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6


---

apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: spring-petclinic-app
  labels:
    app: config-server
spec:
  type: ClusterIP
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888

