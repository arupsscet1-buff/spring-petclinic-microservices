apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: spring-petclinic-app
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-config-server
          image: curlimages/curl:8.9.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for config-server..."
              until curl -sf -o /dev/null http://config-server:8888; do
                sleep 5
              done
              echo "config-server is up."
        - name: wait-for-discovery-server
          image: curlimages/curl:8.9.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for discovery-server..."
              until curl -sf -o /dev/null http://discovery-server:8761; do
                sleep 5
              done
              echo "discovery-server is up."
      containers:
      - name: api-gateway
        image: arupsscet1/spring-petclinic-api-gateway:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: spring-petclinic-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080