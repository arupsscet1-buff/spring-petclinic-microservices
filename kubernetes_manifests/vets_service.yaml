
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vets-service
  namespace: petclinic
  labels:
    app: vet-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: vet-service
  template:
    metadata:
      labels:
        app: vet-service

    spec:
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "apps"
        effect: "NoSchedule"
      nodeSelector:
        role: apps
      containers:
      - name: pet-service
        image: 748624204530.dkr.ecr.ap-south-1.amazonaws.com/spring_petclinic/vets_service:42 
        ports:
          - containerPort: 8081

---

apiVersion: v1
kind: Service
metadata:
  name: vet-service-svc
  namespace: petclinic
spec:
  # Keeps external access on port 80 if type LoadBalancer/ClusterIP
  type: ClusterIP 
  ports:
    - port: 80
      targetPort: 8081   
      protocol: TCP
  selector:
    app: vet-service # Must match the Deployment template label
