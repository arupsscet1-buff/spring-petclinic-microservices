kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: agent-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agent-pv-volume
  labels:
    type: local
spec:
  storageClassName: agent-storage
  claimRef:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  local:
    path: /mnt
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - ip-10-0-19-39.ap-south-1.compute.internal 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-pv-claim
  namespace: devops-tools
spec:
  storageClassName: agent-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
